<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CyberSutra mock evidence-readiness prototype" />
    <title>CyberSutra — Evidence readiness</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="demo-banner" role="status">DEMO / MOCK ENVIRONMENT — no report is sent to a government system</div>
    <main class="shell">
      <header class="site-header">
        <a class="brand" href="#start" aria-label="CyberSutra home">Cyber<span>Sutra</span></a>
        <button id="resetCase" class="text-button" type="button">Start over</button>
      </header>
      <section id="app" aria-live="polite"></section>
    </main>
    <template id="landing-template">
      <section class="hero">
        <p class="eyebrow">Evidence Readiness for Financial Cyber Fraud</p>
        <h1>Connect the threads before you report.</h1>
        <p class="lede">Organize messages, receipts, and links into a clear, evidence-linked incident summary. Prepare a professional report while retaining full control over every detail.</p>
        <div class="actions">
          <button class="primary" data-action="new-case" aria-label="Start a new incident">Start an incident</button>
          <button class="secondary" data-action="load-demo" aria-label="Open a synthetic demo case">Open synthetic demo case</button>
        </div>
        <div class="notice" style="margin-top: 3rem;">
          <strong>Demo Environment</strong><br/>
          This is a private prototype designed to help prepare a structured report. It assists with organization and review, but does not determine guilt. <strong>This system is not the National Cyber Crime Reporting Portal and cannot submit a real complaint to law enforcement.</strong>
        </div>
      </section>
    </template>
    <script type="module" src="app.js"></script>
  </body>
</html>
